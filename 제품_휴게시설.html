<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>휴게시설 · (주)어썸조경</title>
<meta name="description" content="(주)어썸조경 휴게시설 — 퍼걸러 · 로비니아 퍼걸러 · 벤치">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>:root{--g:#1d6a3c;--g2:#144d2b;--ink:#20262a;--mut:#667077;--bg:#f7f8f6;--line:#e2e6e1;--soft:#eef2ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#fff;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo img{height:46px;width:auto}
.back{font-size:14.5px;color:var(--g2);font-weight:600}
.tel{font-weight:700;color:var(--g2);font-size:16px;white-space:nowrap}.tel small{font-weight:500;color:var(--mut);margin-right:6px;font-size:13px}
.gnav{background:var(--bg);border-bottom:1px solid var(--line)}
.gnav .wrap{display:flex;gap:4px;overflow-x:auto}
.gnav a{white-space:nowrap;font-size:14.5px;font-weight:600;padding:12px 12px;color:var(--mut);border-bottom:2px solid transparent}
.gnav a.on{color:var(--g2);border-bottom-color:var(--g2)}
main{padding:34px 0 60px}
.eyebrow{display:block;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--g)}
h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;margin-top:4px}
.pcats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pcats button{border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;padding:7px 15px;border-radius:999px;cursor:pointer;color:var(--ink)}
.pcats button.on{background:var(--g2);border-color:var(--g2);color:#fff}
.pcats small{opacity:.7;margin-left:4px}
.ps{display:flex;margin-top:16px;max-width:420px}
.ps input{flex:1;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:8px}
.ps input:focus{outline:2px solid var(--g);outline-offset:-1px}
.cnt{font-size:13.5px;color:var(--mut);margin-top:12px;min-height:20px}
.pintro .ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:6px}
.pintro .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in}
.pintro .tx{margin-top:14px;font-size:14.5px;color:#3b4348;line-height:1.8}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.pd{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
.pd:hover{border-color:var(--g)}
.pd .im{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1}
.pd img{max-width:100%;max-height:100%;object-fit:contain}
.pd b{display:block;font-size:14px;margin-top:6px}.pd small{display:block;font-size:12.5px;color:var(--mut)}
.more{display:block;margin:22px auto 0;font:inherit;font-size:15px;font-weight:600;color:var(--g2);background:#fff;border:1px solid var(--g2);border-radius:8px;padding:11px 26px;cursor:pointer}
.cm{position:fixed;inset:0;z-index:90;background:rgba(10,20,14,.6);display:none;overflow:auto;padding:30px 16px}.cm.open{display:block}
.cm-in{background:#fff;max-width:1000px;margin:0 auto;border-radius:12px;padding:26px 26px 30px;position:relative}
.cm-x{position:absolute;right:14px;top:14px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.cm h3{font-size:22px}.cm .k{color:var(--mut);font-size:14.5px}
.pdm{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;margin-top:10px;align-items:start}
.pdm .big{border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:14px}
.pdm .big img{max-height:460px;object-fit:contain}
.pdm dl div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}.pdm dt{flex:0 0 70px;color:var(--mut)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.act a{display:inline-block;padding:11px 18px;border-radius:8px;font-weight:600;font-size:14.5px;background:var(--g2);color:#fff}.act a.o{background:#fff;color:var(--g2);border:1px solid var(--line)}
footer{background:var(--g2);color:#fff;padding:30px 0;font-size:14px}footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
@media(max-width:900px){.pgrid{grid-template-columns:1fr 1fr;gap:8px}.pdm{grid-template-columns:1fr}.back{display:none}.cm-in{padding:20px 16px}}
</style><style>.bar .nav{display:flex;gap:22px;font-size:14.5px;color:var(--mut);align-items:center}.bar .nav a:hover{color:var(--g)}.dd{position:relative;height:66px;display:flex;align-items:center}.dd>a i{font-style:normal;font-size:10px;opacity:.6}.ddm{display:none;position:absolute;top:58px;left:-16px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(20,40,30,.12);padding:8px 0;min-width:160px;z-index:60}.ddm a{display:block;padding:8px 18px;white-space:nowrap;color:var(--ink);font-size:14.5px}.ddm a:hover{background:var(--soft);color:var(--g2)}.dd:hover .ddm,.dd:focus-within .ddm{display:block}@media(max-width:900px){.bar .nav{display:none}}</style><style id="mnav">.mbtn{display:none}
@media(max-width:900px){
.mbtn{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;padding:0}
.bar .wrap{position:relative}
.bar .nav.open{display:flex!important;flex-direction:column;align-items:stretch;gap:0;position:absolute;top:66px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 14px 28px rgba(20,40,30,.14);padding:4px 20px 16px;max-height:calc(100vh - 66px);overflow:auto;z-index:70}
.bar .nav.open>a,.bar .nav.open .dd>a{display:block;padding:14px 2px;border-bottom:1px solid var(--line);font-size:16.5px;font-weight:600;color:var(--ink)}
.bar .nav.open .dd{height:auto;display:block}
.bar .nav.open .dd>a i{display:none}
.bar .nav.open .ddm{display:grid!important;grid-template-columns:1fr 1fr;position:static;box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0 10px;min-width:0;background:none}
.bar .nav.open .ddm a{padding:9px 10px;font-size:15px;color:var(--mut);white-space:normal}
}</style></head><body>

const card=(x,k)=>`<button class="pd" data-p="${k}"><span class="im"><img loading="lazy" src="${IM(x.i)}" alt=""></span><b>${esc(title(x))}</b><small>${x.n?esc(x.m)+' · ':''}${esc(x.s)}</small></button>`;
function draw(){
 $('#pc').innerHTML=g.cats.length>1?g.cats.map((c,i)=>`<button class="${i===ci&&!q?'on':''}" data-ci="${i}">${c.c}${c.items.length?`<small>${c.items.length}</small>`:''}</button>`).join(''):'';
 const nq=norm(q);
 if(nq){cur=[];G.forEach(gg=>gg.cats.forEach(c=>c.items.forEach(x=>{if(norm(x.m+x.n+c.c).includes(nq))cur.push(Object.assign({c:c.c,g:gg.g},x))})));
  $('#cnt').textContent=`「${q}」 ${cur.length}건`;$('#pi').innerHTML='';}
 else{const c=g.cats[ci];cur=c.items.map(x=>Object.assign({c:c.c,g:g.g},x));$('#cnt').textContent='';
  $('#pi').innerHTML=`${c.ph.length?`<div class="ph">${c.ph.map(f=>`<img loading="lazy" src="${IM(f)}" alt="">`).join('')}</div>`:''}${c.tx.length&&!c.items.length?`<div class="tx">${c.tx.map(esc).join('<br>')}</div>`:''}`;}
 const show=all?cur:cur.slice(0,20);$('#pgrid').innerHTML=show.map(card).join('');
 const mb=$('#pmore');mb.hidden=all||cur.length<=20;mb.textContent=`제품 더 보기 (${cur.length-20})`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-ci]');if(b){ci=+b.dataset.ci;all=false;q='';$('#pq').value='';history.replaceState(null,'','#'+g.cats[ci].c);draw();return}
 const p=e.target.closest('.pd');if(p){openP(cur[+p.dataset.p]);return}
 const z=e.target.closest('.pintro .ph img');if(z){window.open(z.src,'_blank');return}
 if(e.target.id==='cm'||e.target.closest('.cm-x')){$('#cm').classList.remove('open');document.body.style.overflow=''}
});
$('#pmore').onclick=()=>{all=true;draw()};
let tm;$('#pq').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim();all=false;draw()},200)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#cm').classList.remove('open');document.body.style.overflow=''}});
function openP(x){
 const rows=[['품목',x.g+' · '+x.c],['모델',x.m],['규격',x.s],['재질',x.t],['설치면적',x.a]].filter(r=>r[1]);
 const sub=encodeURIComponent(`[제품 문의] ${x.c} ${x.m}`);
 $('#cmIn').innerHTML=`<button class="cm-x" type="button">✕ 닫기</button><h3>${esc(title(x))}</h3><p class="k">${esc(x.c)}</p>
 <div class="pdm"><div class="big"><img src="${IM(x.i)}" alt=""></div><div><dl>${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>
 <div class="act"><a href="mailto:awesome5321@naver.com?subject=${sub}">이 제품 문의하기</a><a class="o" href="tel:16448321">1644-8321</a></div></div></div>`;
 $('#cm').classList.add('open');$('#cm').scrollTop=0;document.body.style.overflow='hidden';
}
const h=decodeURIComponent(location.hash.slice(1));const hi=g.cats.findIndex(c=>c.c===h);if(hi>=0)ci=hi;
draw();
</script>
<script id="mnavjs">(function(){var b=document.querySelector('.mbtn'),n=document.querySelector('.bar .nav');if(!b||!n)return;
function sh(o){n.classList.toggle('open',o);b.textContent=o?'✕':'☰';b.setAttribute('aria-expanded',o)}
b.addEventListener('click',function(){sh(!n.classList.contains('open'))});
n.addEventListener('click',function(e){var a=e.target.closest('a');if(!a||!n.classList.contains('open'))return;if(a.parentElement.classList.contains('dd')){e.preventDefault();return}sh(false)});
window.addEventListener('resize',function(){if(innerWidth>900)sh(false)});})();</script>
</body></html>
